{% block header %}
    <header class="container-fluid">
        <div class="row align-items-center m-4 p-4 border-bottom">
            <div class="col-9">
                <a href="{% url "home" %}">
                    <h1>{{ title }}</h1>
                </a>
            </div>
            <div class="col text-end">
                {% if user.is_authenticated %}
                    <a href="{% url "user-account" user.username %}">
                        {{ user.username }}
                    </a>
                    <a href="{% url "user-logout" %}">Logout</a>
                {% else %}
                    <a href="{% url "user-register" %}">Register</a>
                    <a href="{% url "user-login" %}">Login</a>
                {% endif %}
            </div>
        </div>
    </header>
{% endblock header %}

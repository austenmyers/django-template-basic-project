{% block header %}
    <header>
        <a href="{% url "home" %}">
            <h1>{{ title }}</h1>
        </a>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url "user-account" user.username %}">
                    {{ user.username }}
                </a>
                <a href="{% url "user-logout" %}">Logout</a>
            {% else %}
                <a href="{% url "user-register" %}">Register</a>
                <a href="{% url "user-login" %}">Login</a>
            {% endif %}
        </nav>
    </header>
{% endblock header %}
